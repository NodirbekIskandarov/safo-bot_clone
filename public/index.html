<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botxona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #fff);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --link: var(--tg-theme-link-color, #64b5ef);
    --btn: var(--tg-theme-button-color, #3390ec);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --radius: 14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  .muted{color:var(--hint)}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  h1{font-size:20px;margin:4px 0 14px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--hint);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .row + .row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px}
  .stat b{display:block;font-size:24px;line-height:1.2;margin-bottom:2px}
  .stat span{color:var(--hint);font-size:12px}
  .balance{background:linear-gradient(135deg,var(--btn),#7c4dff);border-radius:var(--radius);
    padding:18px;margin-bottom:12px}
  .balance b{display:block;font-size:30px;margin-top:4px}
  .balance span{opacity:.85;font-size:13px}
  .pill{font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .ok{background:rgba(76,201,124,.18);color:#4cc97c}
  .warn{background:rgba(255,183,77,.18);color:#ffb74d}
  .bad{background:rgba(255,110,110,.18);color:#ff6e6e}
  .bar{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:12px}
  .bar i{flex:1;background:var(--btn);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  button{width:100%;background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;
    padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 14px;border-radius:99px;background:var(--card);color:var(--hint);
    font-size:13px;white-space:nowrap;cursor:pointer;border:0}
  .tab.on{background:var(--btn);color:var(--btn-text)}
  .empty{text-align:center;padding:36px 16px;color:var(--hint)}
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--btn);
    border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:var(--link)}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>

<script src="/app.js"></script>
</body>
</html>
