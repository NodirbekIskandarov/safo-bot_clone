<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botxona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #fff);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --link: var(--tg-theme-link-color, #64b5ef);
    --btn: var(--tg-theme-button-color, #3390ec);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --ok:#4cc97c; --warn:#ffb74d; --bad:#ff6e6e; --accent:#7c4dff;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:10px 12px calc(28px + env(safe-area-inset-bottom))}

  /* ---------- motion ---------- */
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes grow{from{height:0}}
  @keyframes shimmer{100%{background-position:200% 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ring{from{stroke-dashoffset:var(--circ)}}
  .anim{animation:up .42s cubic-bezier(.22,.9,.3,1) backwards}
  @media (prefers-reduced-motion:reduce){
    .anim,.bar i,.ring circle{animation:none!important}
    html{scroll-behavior:auto}
  }

  /* ---------- blocks ---------- */
  .card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .card.tap{cursor:pointer;transition:transform .16s ease,opacity .16s ease}
  .card.tap:active{transform:scale(.985);opacity:.9}
  h1{font-size:21px;margin:6px 0 2px;letter-spacing:-.01em}
  .sub{color:var(--hint);font-size:13px;margin:0 0 14px}
  h2{font-size:12px;margin:20px 0 8px;color:var(--hint);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .row+.row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
  .muted{color:var(--hint)}
  .sm{font-size:12px}
  a{color:var(--link);text-decoration:none}

  .hero{background:linear-gradient(135deg,var(--btn),var(--accent));border-radius:var(--r);
    padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;inset:-40% -20% auto auto;width:180px;height:180px;
    background:rgba(255,255,255,.12);border-radius:50%}
  .hero span{opacity:.85;font-size:13px;position:relative}
  .hero b{display:block;font-size:32px;margin-top:2px;position:relative;letter-spacing:-.02em}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .stat{background:var(--card);border-radius:var(--r);padding:13px}
  .stat b{display:block;font-size:22px;line-height:1.15;letter-spacing:-.02em}
  .stat span{color:var(--hint);font-size:11px;display:block;margin-top:3px}

  .pill{font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
  .ok{background:rgba(76,201,124,.16);color:var(--ok)}
  .warn{background:rgba(255,183,77,.16);color:var(--warn)}
  .bad{background:rgba(255,110,110,.16);color:var(--bad)}
  .dim{background:rgba(125,139,153,.16);color:var(--hint)}

  .bar{display:flex;align-items:flex-end;gap:3px;height:78px;margin-top:6px}
  .bar i{flex:1;background:linear-gradient(180deg,var(--btn),var(--accent));border-radius:4px 4px 0 0;
    min-height:3px;animation:grow .6s cubic-bezier(.22,.9,.3,1) backwards}
  .bar-x{display:flex;justify-content:space-between;margin-top:6px}

  .ring{display:block;margin:0 auto}
  .ring circle{animation:ring 1s cubic-bezier(.22,.9,.3,1) backwards}

  .tabs{display:flex;gap:6px;margin:0 -12px 12px;padding:0 12px 2px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 15px;border-radius:99px;background:var(--card);color:var(--hint);
    font-size:13px;font-weight:600;white-space:nowrap;border:0;cursor:pointer;
    transition:background .18s,color .18s,transform .12s}
  .tab:active{transform:scale(.95)}
  .tab.on{background:var(--btn);color:var(--btn-text)}

  button.wide{width:100%;background:var(--btn);color:var(--btn-text);border:0;border-radius:13px;
    padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
  button.wide:active{transform:scale(.98);opacity:.92}
  .ghost{background:var(--card);color:var(--text)}

  .empty{text-align:center;padding:40px 16px;color:var(--hint);animation:pop .4s backwards}
  .empty div{font-size:42px;margin-bottom:8px}

  .skel{background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,.07) 37%,var(--card) 63%);
    background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r)}
  .skel.h{height:74px;margin-bottom:10px}
  .skel.hero{height:92px;margin-bottom:12px}

  .list{max-height:0;overflow:hidden;transition:max-height .32s ease}
  .list.open{max-height:1400px}
  .chev{transition:transform .25s ease;display:inline-block;color:var(--hint)}
  .chev.open{transform:rotate(90deg)}
</style>
</head>
<body>
<div id="app">
  <div class="skel hero"></div>
  <div class="skel h"></div><div class="skel h"></div><div class="skel h"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
